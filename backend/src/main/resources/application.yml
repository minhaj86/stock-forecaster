# Base configuration = production-safe defaults. Profiles (local, test, prod) only override what differs.
spring:
  application:
    name: stock-forecast-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: stock-forecast-db
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000 # milliseconds (Hikari binds a raw long)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        # order_inserts stays off: cross-aggregate FKs are plain id columns that Hibernate cannot see when reordering.
        order_updates: true
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 1s
  cache:
    # "none" runs without Redis (every lookup is computed); cache failures never fail requests.
    type: ${CACHE_TYPE:redis}
    redis:
      key-prefix: "sf:v1:"
      time-to-live: 1h
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  info:
    java:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:stock-forecast}
      audience: ${JWT_AUDIENCE:stock-forecast-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      secret: ${JWT_SECRET:}
      allow-ephemeral-secret: false
    session:
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
      max-lifetime: ${SESSION_MAX_LIFETIME:30d}
      reuse-grace-period: 10s
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
    password:
      bcrypt-strength: 12
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  market-data:
    # Required: the active provider id. "synthetic" serves clearly labelled simulated prices for demos.
    provider: ${MARKET_DATA_PROVIDER:}
    history-years: 5
    sync:
      cron: ${MARKET_DATA_SYNC_CRON:0 30 22 * * MON-FRI}
      on-startup: true
  forecast:
    default-model: EXPONENTIAL_SMOOTHING
    default-horizon: 30 # trading days
    max-horizon: 90
    horizons: [5, 10, 20, 30, 60, 90]
    confidence-level: 0.8 # nominal coverage of the uncertainty range
    minimum-history-days: 250 # no forecast from less history (422 INSUFFICIENT_FORECAST_HISTORY)
    max-history-days: 1500
    interval-calibration-origins: 250 # past origins whose errors size the uncertainty range
    interval-minimum-samples: 20
    cache-time-to-live: 12h # keys embed the data version, so this only bounds memory
    backtest:
      evaluation-window-days: 250
      origin-step-days: 5
      minimum-origins: 20
    moving-average:
      default-window: 20
    linear-regression:
      default-lookback: 252
    exponential-smoothing:
      optimize-parameters: true
      default-lookback: 504
