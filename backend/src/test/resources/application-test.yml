# Integration tests: the datasource is provided by Testcontainers (@ServiceConnection).
app:
  security:
    jwt:
      allow-ephemeral-secret: true
    password:
      bcrypt-strength: 4
    session:
      # Replay detection is exercised end-to-end; the grace-period race handling is covered by unit tests.
      reuse-grace-period: 0s
  cors:
    allowed-origins: http://localhost:5173
  market-data:
    provider: synthetic
    sync:
      # Scheduled and startup synchronisation are exercised explicitly; watchlist-triggered jobs stay active.
      cron: "-"
      on-startup: false
    jobs:
      # Jobs start as soon as they are queued (wake-up); the poll only picks up retries quickly.
      poll-interval: PT0.5S
      retry-base-delay: PT0.2S
      retry-max-delay: PT1S
      max-attempts: 2
    health:
      min-refresh-interval: PT0S

logging:
  level:
    com.stockforecast: INFO
    org.testcontainers: INFO
